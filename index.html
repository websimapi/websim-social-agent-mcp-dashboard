<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Agent MCP Dashboard</title>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom": "https://esm.sh/react-dom@18.2.0",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0"
      }
    }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @keyframes pulse-custom {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .animate-pulse-slow {
            animation: pulse-custom 3s infinite;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-screen overflow-hidden">
    <div id="root" class="h-full"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import ReactDOM from 'react-dom';
        import { 
            LayoutDashboard, 
            MessageSquare, 
            Settings, 
            Shield, 
            Twitter, 
            Linkedin, 
            Terminal,
            Send,
            Zap,
            Wifi,
            WifiOff,
            RefreshCw
        } from 'lucide-react';

        const App = () => {
            const [connected, setConnected] = useState(false);
            const [isConnecting, setIsConnecting] = useState(false);
            const [activeTab, setActiveTab] = useState('feed'); // 'feed', 'chat', 'logs'
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);
            const [logs, setLogs] = useState([{ type: 'info', content: 'Agent UI Initialized. Ready to connect.' }]);
            const [accounts, setAccounts] = useState({ twitter: { connected: false }, linkedin: { connected: false } });
            const [feed, setFeed] = useState([]);
            const [userInput, setUserInput] = useState('');
            const [isAiThinking, setIsAiThinking] = useState(false);
            const socketRef = useRef(null);
            const logEndRef = useRef(null);

            useEffect(() => {
                return () => socketRef.current?.close();
            }, []);

            useEffect(() => {
                logEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [logs]);

            const connectBridge = () => {
                if (socketRef.current?.readyState === WebSocket.OPEN) return;
                
                setIsConnecting(true);
                addLog('Attempting to connect to local bridge...', 'info');
                
                const socket = new WebSocket('ws://localhost:8080');
                
                socket.onopen = () => {
                    setConnected(true);
                    setIsConnecting(false);
                    addLog('Connected to Local Bridge', 'success');
                    socket.send(JSON.stringify({ type: 'GET_STATUS' }));
                };

                socket.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    handleBridgeMessage(data);
                };

                socket.onclose = () => {
                    setConnected(false);
                    setIsConnecting(false);
                    addLog('Connection failed or closed. Ensure bridge is running.', 'error');
                };

                socket.onerror = () => {
                    setIsConnecting(false);
                    addLog('Bridge connection error. Is the Node server running?', 'error');
                };

                socketRef.current = socket;
            };

            const addLog = (content, type = 'info') => {
                setLogs(prev => [...prev, { content, type, time: new Date().toLocaleTimeString() }]);
            };

            const handleBridgeMessage = (data) => {
                switch(data.type) {
                    case 'STATUS_UPDATE':
                        setAccounts(data.payload);
                        break;
                    case 'LOG':
                        addLog(data.content, data.level);
                        break;
                    case 'FEED_DATA':
                        setFeed(data.data);
                        addLog(`Fetched feed for ${data.platform}`, 'info');
                        break;
                }
            };

            const loginPlatform = (platform) => {
                if (!connected) return;
                socketRef.current.send(JSON.stringify({ type: 'LOGIN_PLATFORM', platform }));
            };

            const handleAiChat = async () => {
                if (!userInput.trim()) return;
                const message = userInput;
                setUserInput('');
                addLog(`User: ${message}`, 'info');
                setIsAiThinking(true);

                try {
                    const completion = await websim.chat.completions.create({
                        messages: [
                            {
                                role: "system",
                                content: `You are the Social Media Agent Controller. 
                                Current system state: Bridge Connected: ${connected}, 
                                Platforms: Twitter (${accounts.twitter.connected ? 'Active' : 'Offline'}), 
                                LinkedIn (${accounts.linkedin.connected ? 'Active' : 'Offline'}).
                                Help the user manage posts, summarize feeds, and handle interactions.
                                Respond concisely. If the user wants to post, provide a 'POST_COMMAND' structure.`
                            },
                            { role: "user", content: message }
                        ]
                    });

                    const response = completion.content;
                    addLog(`Agent: ${response}`, 'ai');
                    
                    // Simple logic to detect if AI wants to perform an action
                    if (response.toLowerCase().includes('post') && accounts.twitter.connected) {
                         // Logic for auto-posting would go here
                    }

                } catch (err) {
                    addLog('AI Reasoning failed: ' + err.message, 'error');
                } finally {
                    setIsAiThinking(false);
                }
            };

            return (
                <div className="flex flex-col md:flex-row h-full bg-slate-950 overflow-hidden relative">
                    {/* Mobile Sidebar Toggle Backdrop */}
                    {isSidebarOpen && (
                        <div 
                            className="fixed inset-0 bg-black/60 z-40 md:hidden"
                            onClick={() => setIsSidebarOpen(false)}
                        ></div>
                    )}

                    {/* Sidebar / Navigation */}
                    <aside className={`
                        fixed md:static inset-y-0 left-0 w-72 md:w-64 bg-slate-950 border-r border-slate-800 p-4 
                        flex flex-col gap-6 z-50 transition-transform duration-300 ease-in-out
                        ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}
                    `}>
                        <div className="flex items-center justify-between md:justify-start gap-2 px-2">
                            <div className="flex items-center gap-2">
                                <div className={`w-3 h-3 rounded-full ${connected ? 'bg-green-500 shadow-[0_0_10px_#22c55e]' : 'bg-red-500'}`}></div>
                                <h1 className="font-bold tracking-tight">AGENT MCP</h1>
                            </div>
                            <button onClick={() => setIsSidebarOpen(false)} className="md:hidden text-slate-400">
                                <RefreshCw size={20} className="rotate-45" />
                            </button>
                        </div>

                        <nav className="flex flex-col gap-1">
                            <div className="text-xs font-semibold text-slate-500 uppercase px-2 mb-2">Social Hub</div>
                            <button 
                                onClick={() => { loginPlatform('twitter'); setIsSidebarOpen(false); }}
                                className={`flex items-center gap-3 p-3 md:p-2 rounded-lg transition-colors ${accounts.twitter.connected ? 'bg-sky-500/10 text-sky-400' : 'hover:bg-slate-900 text-slate-400'}`}
                            >
                                <Twitter size={18} /> 
                                <span className="text-sm">Twitter / X</span>
                                {accounts.twitter.connected && <Zap size={12} className="ml-auto animate-pulse" />}
                            </button>
                            <button 
                                onClick={() => { loginPlatform('linkedin'); setIsSidebarOpen(false); }}
                                className={`flex items-center gap-3 p-3 md:p-2 rounded-lg transition-colors ${accounts.linkedin.connected ? 'bg-blue-600/10 text-blue-400' : 'hover:bg-slate-900 text-slate-400'}`}
                            >
                                <Linkedin size={18} /> 
                                <span className="text-sm">LinkedIn</span>
                            </button>
                        </nav>

                        <div className="mt-auto bg-slate-900/50 rounded-xl p-4 border border-slate-800">
                            <div className="flex items-center justify-between mb-2">
                                <span className="text-xs text-slate-500">Bridge Status</span>
                                {connected ? <Wifi size={14} className="text-green-500" /> : <WifiOff size={14} className="text-red-500" />}
                            </div>
                            <div className="text-[10px] truncate text-slate-500 font-mono mb-2">ws://localhost:8080</div>
                            <button 
                                onClick={() => { connectBridge(); setIsSidebarOpen(false); }} 
                                disabled={isConnecting}
                                className={`w-full py-2 text-xs rounded flex items-center justify-center gap-2 transition-colors ${
                                    isConnecting ? 'bg-slate-800 text-slate-500' : 'bg-indigo-600 hover:bg-indigo-500 text-white'
                                }`}
                            >
                                {isConnecting ? <RefreshCw size={12} className="animate-spin" /> : <RefreshCw size={12} />}
                                {connected ? 'Reconnect' : 'Connect Bridge'}
                            </button>
                        </div>
                    </aside>

                    {/* Main Content Area */}
                    <main className="flex-1 flex flex-col min-w-0 h-full relative">
                        {/* Header */}
                        <header className="h-14 md:h-16 border-b border-slate-800 flex items-center justify-between px-4 md:px-6 bg-slate-950/50 backdrop-blur-sm">
                            <div className="flex items-center gap-3 md:gap-4">
                                <button onClick={() => setIsSidebarOpen(true)} className="md:hidden text-slate-400 hover:text-white p-1">
                                    <LayoutDashboard size={20} />
                                </button>
                                <h2 className="text-sm font-medium hidden xs:block">Control Dashboard</h2>
                            </div>
                            
                            {/* Mobile Tab Switcher */}
                            <div className="flex md:hidden bg-slate-900 rounded-lg p-1 gap-1">
                                <button 
                                    onClick={() => setActiveTab('feed')}
                                    className={`px-3 py-1 rounded-md text-[10px] uppercase font-bold transition-all ${activeTab === 'feed' ? 'bg-slate-800 text-white' : 'text-slate-500'}`}
                                >Feed</button>
                                <button 
                                    onClick={() => setActiveTab('chat')}
                                    className={`px-3 py-1 rounded-md text-[10px] uppercase font-bold transition-all ${activeTab === 'chat' ? 'bg-slate-800 text-white' : 'text-slate-500'}`}
                                >Chat</button>
                                <button 
                                    onClick={() => setActiveTab('logs')}
                                    className={`px-3 py-1 rounded-md text-[10px] uppercase font-bold transition-all ${activeTab === 'logs' ? 'bg-slate-800 text-white' : 'text-slate-500'}`}
                                >Logs</button>
                            </div>

                            <div className="flex items-center gap-3 md:gap-4">
                                <Shield size={18} className="text-green-500/50" />
                                <Settings size={18} className="text-slate-500 cursor-pointer hover:text-slate-300" />
                            </div>
                        </header>

                        {/* Content Body */}
                        {!connected && !isConnecting && (
                            <div className="absolute inset-0 z-30 bg-slate-950/90 flex flex-col items-center justify-center p-6 text-center">
                                <div className="bg-indigo-500/10 p-6 rounded-full mb-6">
                                    <WifiOff size={48} className="text-indigo-400" />
                                </div>
                                <h3 className="text-xl font-bold mb-2">Bridge Offline</h3>
                                <p className="text-slate-400 text-sm max-w-xs mb-6">
                                    Start the Node.js bridge locally to connect your social media accounts to the AI Agent.
                                </p>
                                <button 
                                    onClick={connectBridge}
                                    className="bg-indigo-600 hover:bg-indigo-500 text-white px-8 py-3 rounded-xl font-bold transition-all shadow-lg shadow-indigo-500/20"
                                >
                                    Connect to Local Bridge
                                </button>
                            </div>
                        )}

                        <div className="flex-1 flex flex-col md:grid md:grid-cols-12 gap-4 p-4 overflow-hidden">
                            
                            {/* Feed / Activity Panel */}
                            <div className={`col-span-8 flex flex-col gap-4 overflow-hidden ${activeTab === 'feed' ? 'flex' : 'hidden md:flex'}`}>
                                <div className="bg-slate-900/30 border border-slate-800 rounded-xl flex-1 flex flex-col overflow-hidden">
                                    <div className="p-3 md:p-4 border-b border-slate-800 flex items-center justify-between">
                                        <div className="flex items-center gap-2">
                                            <MessageSquare size={16} className="text-slate-400" />
                                            <span className="text-sm font-semibold">Activity Feed</span>
                                        </div>
                                    </div>
                                    <div className="flex-1 overflow-y-auto p-3 md:p-4 flex flex-col gap-3">
                                        {feed.length === 0 ? (
                                            <div className="h-full flex flex-col items-center justify-center text-slate-600 gap-2">
                                                <Zap size={32} className="opacity-20" />
                                                <p className="text-sm">Connect a platform to see activity</p>
                                            </div>
                                        ) : (
                                            feed.map(item => (
                                                <div key={item.id} className="bg-slate-800/40 border border-slate-700/50 p-3 rounded-lg flex flex-col gap-1">
                                                    <div className="flex items-center justify-between">
                                                        <span className="text-xs font-bold text-slate-300">@{item.author}</span>
                                                        <span className="text-[10px] uppercase text-slate-500 font-mono">{item.platform}</span>
                                                    </div>
                                                    <p className="text-sm text-slate-400">{item.text}</p>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>

                                {/* Chat Interface (Desktop always shows, Mobile Tab) */}
                                <div className={`bg-slate-900/50 border border-slate-800 rounded-xl h-48 md:flex flex-col overflow-hidden shadow-2xl hidden`}>
                                    <ChatPanel logs={logs} isAiThinking={isAiThinking} userInput={userInput} setUserInput={setUserInput} handleAiChat={handleAiChat} />
                                </div>
                            </div>

                            {/* Mobile specific Chat Tab View */}
                            <div className={`flex-1 flex-col overflow-hidden md:hidden ${activeTab === 'chat' ? 'flex' : 'hidden'}`}>
                                <div className="bg-slate-900/50 border border-slate-800 rounded-xl flex-1 flex flex-col overflow-hidden">
                                     <ChatPanel logs={logs} isAiThinking={isAiThinking} userInput={userInput} setUserInput={setUserInput} handleAiChat={handleAiChat} />
                                </div>
                            </div>

                            {/* System Logs Panel */}
                            <div className={`col-span-4 bg-slate-900/50 border border-slate-800 rounded-xl flex flex-col overflow-hidden ${activeTab === 'logs' ? 'flex' : 'hidden md:flex'}`}>
                                <div className="p-3 border-b border-slate-800 flex items-center justify-between">
                                    <div className="flex items-center gap-2">
                                        <Terminal size={14} className="text-slate-400" />
                                        <span className="text-xs font-semibold uppercase tracking-wider text-slate-500">System Logs</span>
                                    </div>
                                </div>
                                <div className="flex-1 overflow-y-auto p-3 font-mono text-[11px] space-y-1">
                                    {logs.map((log, i) => (
                                        <div key={i} className={`break-all ${
                                            log.type === 'success' ? 'text-green-400' : 
                                            log.type === 'error' ? 'text-red-400' : 
                                            log.type === 'ai' ? 'text-indigo-400' : 'text-slate-500'
                                        }`}>
                                            <span className="opacity-50 mr-2">[{log.time || '--:--'}]</span>
                                            {log.content}
                                        </div>
                                    ))}
                                    <div ref={logEndRef} />
                                </div>
                            </div>

                        </div>

                        {/* Persistent Chat Input for Desktop when on Feed Tab */}
                        <div className="hidden md:block absolute bottom-6 right-6 w-96 z-20">
                           {/* Using the ChatPanel as the lower section of the dashboard */}
                        </div>
                    </main>
                </div>
            );
        };

        const ChatPanel = ({ logs, isAiThinking, userInput, setUserInput, handleAiChat }) => {
            return (
                <React.Fragment>
                    <div className="flex-1 overflow-y-auto p-4 space-y-2">
                        {logs.filter(l => l.type === 'ai' || l.type === 'user').length === 0 && (
                            <p className="text-xs text-slate-500 text-center mt-8">Ask the Agent to analyze feed or draft a post...</p>
                        )}
                        {logs.filter(l => l.type === 'ai' || l.type === 'user').map((log, i) => (
                            <div key={i} className={`text-sm p-3 rounded-lg ${log.type === 'ai' ? 'bg-indigo-500/10 text-indigo-300 border border-indigo-500/20' : 'bg-slate-800/50 text-slate-300 border border-slate-700/50'}`}>
                                <div className="flex items-center gap-2 mb-1">
                                    <span className="text-xs font-bold uppercase opacity-50">{log.type === 'ai' ? 'Agent' : 'You'}</span>
                                </div>
                                {log.content}
                            </div>
                        ))}
                        {isAiThinking && (
                            <div className="text-xs text-indigo-400 animate-pulse-slow flex items-center gap-2">
                                <div className="w-1.5 h-1.5 bg-indigo-400 rounded-full animate-bounce"></div>
                                Agent is thinking...
                            </div>
                        )}
                    </div>
                    <div className="p-3 border-t border-slate-800 flex gap-2 bg-slate-900/80">
                        <input 
                            type="text" 
                            value={userInput}
                            onChange={(e) => setUserInput(e.target.value)}
                            onKeyPress={(e) => e.key === 'Enter' && handleAiChat()}
                            placeholder="Message Agent..."
                            className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-indigo-500 transition-colors"
                        />
                        <button 
                            onClick={handleAiChat}
                            className="bg-indigo-600 hover:bg-indigo-500 text-white p-2.5 rounded-xl transition-colors shadow-lg shadow-indigo-500/10"
                        >
                            <Send size={18} />
                        </button>
                    </div>
                </React.Fragment>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>

</body>
</html>
